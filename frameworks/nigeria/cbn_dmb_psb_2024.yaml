- control_id: CBN-DMBPSB-APP3-1.1
  reference: Appendix III 1.1
  title: Access control and multi-factor authentication
  requirement_summary: Maintain an access-control policy, periodic least-privilege
    access review, prompt access modification or revocation, and layered authentication
    controls. Apply MFA to critical systems and to employee, customer and third-party
    access where specified by the framework.
  evidence_examples:
  - access control policy
  - access review evidence
  - joiner mover leaver records
  - MFA configuration
  - RBAC matrix
  capability_tags:
  - access_control
  - mfa
  - least_privilege
  - identity_security
  weight: 1.6
  source_locator: Appendix III, Preventive Controls 1.1 Access Controls
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 34
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-APP3-1.2
  reference: Appendix III 1.2
  title: Privileged access management
  requirement_summary: Apply privileged-access safeguards including least privilege,
    segregation of duties, just-in-time access, session monitoring and credential
    vaulting as appropriate; preserve and review privileged-user audit trails and
    prohibit unsafe shared/default privileged credentials.
  evidence_examples:
  - PAM policy
  - privileged account register
  - vault configuration
  - session logs
  - privileged access review
  - segregation-of-duties matrix
  capability_tags:
  - privileged_access
  - pam
  - least_privilege
  - logging
  weight: 1.6
  source_locator: Appendix III, Preventive Controls 1.2 Privileged Access Management
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 35
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
