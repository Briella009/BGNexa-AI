- control_id: CBN-DMBPSB-6.0
  reference: '6.0'
  title: Cybersecurity statutory/regulatory compliance and industry exercises
  requirement_summary: Maintain governance for relevant cybersecurity legal and regulatory
    requirements and participate in applicable industry cyber exercises/programmes
    to evaluate recovery preparedness.
  evidence_examples:
  - legal register
  - regulatory mapping
  - compliance review
  - cyber drill report
  - war-game report
  - remediation plan
  capability_tags:
