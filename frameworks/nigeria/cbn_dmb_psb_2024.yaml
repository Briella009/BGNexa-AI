- control_id: CBN-DMBPSB-4.8
  reference: '4.8'
  title: Emerging-technology approval and due diligence
  requirement_summary: Apply regulatory approval, licensing checks, professional due
    diligence and the required minimum security controls when adopting or implementing
    emerging technologies.
  evidence_examples:
  - CBN approval
  - technology risk assessment
  - due diligence record
  - architecture/security review
  - API approval
  - cloud/AI risk assessment
  capability_tags:
