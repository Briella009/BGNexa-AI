- control_id: CBN-DMBPSB-3.6
  reference: '3.6'
  title: Cyber-threat intelligence capability
  requirement_summary: Maintain knowledge of relevant emerging threats, attacks, attack
    vectors, mechanisms and indicators of attack or compromise that may affect information
    assets, and use threat intelligence to support cyber-risk and defensive activities.
  evidence_examples:
  - threat intelligence procedure
  - threat reports
  - indicators of compromise
