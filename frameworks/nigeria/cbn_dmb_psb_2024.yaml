- control_id: CBN-DMBPSB-APP3-1.6
  reference: Appendix III 1.6
  title: Secure application and data lifecycle
  requirement_summary: Build security into the system/application lifecycle, document
    security requirements, use secure coding and security testing, assess open-source
    components, protect sensitive data with classification/access controls/encryption,
    prevent data leakage, maintain tested backups and secure disposal, and address
    applicable data-protection obligations.
