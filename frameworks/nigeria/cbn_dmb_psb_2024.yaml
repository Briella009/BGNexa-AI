scope_note: Selected high-value DMB/PSB readiness controls. This is a traceable seed
  pack, not an exhaustive replacement for the full CBN framework.
copyright_mode: public_regulatory_guidance_paraphrase
controls:
- control_id: CBN-DMBPSB-1.1
  reference: '1.1'
  title: Board cybersecurity oversight and competence
  requirement_summary: Maintain Board oversight of the cybersecurity programme, integrate
    cybersecurity governance into the organisation, ensure appropriate Board ICT/cybersecurity
    competence, and provide leadership, direction and resources.
  evidence_examples:
  - board charter
  - board skills matrix
  - cybersecurity governance framework
  - board approvals
  - cybersecurity budget
  capability_tags:
  - governance
  - board_oversight
  weight: 1.5
  source_locator: Section 1.1
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 6
  - 7
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-1.1-VIII
  reference: 1.1(viii)
  title: Quarterly Board cybersecurity reporting
  requirement_summary: Provide the Board with quarterly cybersecurity programme reporting
    covering material cyber-risk information, security initiatives, incidents, vulnerability/penetration-test
    remediation and approved risk thresholds.
  evidence_examples:
  - quarterly board cyber report
  - board pack
  - risk dashboard
  - vulnerability remediation report
  - board minutes
  capability_tags:
  - governance
  - metrics
  - reporting
  - board_oversight
  weight: 1.2
  source_locator: Section 1.1(viii)
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 7
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-1.5
  reference: '1.5'
  title: Information Security Steering Committee
  requirement_summary: Maintain an Information Security Steering Committee with senior
    representation and defined terms of reference; the committee should meet at least
    quarterly and review the state of cybersecurity.
  evidence_examples:
  - ISSC charter
  - terms of reference
  - quarterly meeting minutes
  - state-of-cybersecurity report
  capability_tags:
  - governance
  - security_committee
  - reporting
  weight: 1.0
  source_locator: Section 1.5
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 11
  - 12
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-2.1.2
  reference: 2.1.2
  title: Cybersecurity risk assessment
  requirement_summary: Evaluate cybersecurity risks at least annually and when major
    organisational or technology changes occur, document the outcome in the required
    risk-control self-assessment, and periodically review the methodology independently.
  evidence_examples:
  - annual cyber risk assessment
  - change risk assessment
  - cyber risk control self-assessment
  - audit methodology review
  - risk register
  capability_tags:
  - risk_assessment
  - governance
  - audit
  weight: 1.5
  source_locator: Section 2.1.2
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 14
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-2.2
  reference: '2.2'
  title: Vulnerability assessment and penetration testing
  requirement_summary: Maintain vulnerability and threat assessment activities, including
    at least annual third-party penetration testing and quarterly internal vulnerability
    scanning, with risk assessment/sign-off before new technology-based products are
    deployed.
  evidence_examples:
  - vulnerability assessment
  - quarterly scan reports
  - annual penetration test
  - remediation tracker
  - product security sign-off
  capability_tags:
  - vulnerability_management
  - penetration_testing
  - risk_assessment
  weight: 1.5
  source_locator: Section 2.2
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 15
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-2.3
  reference: '2.3'
  title: Third-party cybersecurity risk management
  requirement_summary: Operate a third-party cyber-risk framework covering vendor
    selection, due diligence, contracts, ongoing monitoring, incident response, assurance/audit
    rights, relevant security obligations and continuity/recovery testing.
  evidence_examples:
  - third-party risk framework
  - vendor due diligence
  - contracts
  - SLA audit clause
  - vendor assurance report
  - joint BCP test
  capability_tags:
  - third_party_risk
  - contracts
  - business_continuity
  weight: 1.5
  source_locator: Section 2.3
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 16
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-2.4-2.5
  reference: 2.4-2.5
  title: Annual CBN cybersecurity maturity self-assessment and submission
  requirement_summary: Conduct the annual CBN Cybersecurity Self-Assessment Tool evaluation,
    define current and target maturity profiles, and submit the prior calendar year's
    self-assessment to Banking Supervision by 28 February with required CISO and Executive
    Management endorsement.
  evidence_examples:
  - completed CSAT
  - target maturity roadmap
  - CISO sign-off
  - executive endorsement
  - CBN submission acknowledgement
  capability_tags:
  - self_assessment
  - regulatory_reporting
  - maturity
  weight: 1.7
  source_locator: Sections 2.4 and 2.5
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 16
  - 17
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-3.1
  reference: 3.1 / Appendix II 1.1
  title: Asset, data and network inventory
  requirement_summary: Maintain current inventories of authorised IT and data assets,
    ownership, criticality, access profiles and network connections, supported by
    an approved current network topology and regular review of unnecessary connections.
  evidence_examples:
  - CMDB
  - asset inventory
  - data inventory
  - network diagram
  - privileged account register
  - connection catalogue
  capability_tags:
  - asset_management
  - data_governance
  - network_security
  weight: 1.4
  source_locator: Section 3.1 and Appendix II 1.1
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 18
  - 29
  - 30
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-3.3
  reference: '3.3'
  title: Continuous monitoring and detection
  requirement_summary: Maintain capability for ongoing 24/7 monitoring of relevant
    systems, infrastructure, applications and services to detect anomalies and cyber
    incidents promptly.
  evidence_examples:
  - SOC operating model
  - SIEM monitoring procedure
  - 24x7 roster
  - detection use cases
  - alert records
  capability_tags:
  - monitoring
  - detection
  - soc
  weight: 1.5
  source_locator: Section 3.3
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 18
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-3.4
  reference: '3.4'
  title: Cyber-incident response capability
  requirement_summary: Maintain an accessible capability to respond to cyber incidents,
    whether operated internally or through an outsourced provider.
  evidence_examples:
