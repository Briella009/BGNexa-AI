  reference: Appendix III 1.5
  title: Secure configuration and system hardening
  requirement_summary: Define and maintain security baseline configurations, centrally
    govern security-solution settings, harden new systems, applications and databases
    before deployment, keep baselines current, review configuration information and
    apply strong wireless encryption.
  evidence_examples:
  - secure configuration standard
  - hardening checklist
  - baseline configuration
  - configuration review
  - wireless security standard
  capability_tags:
  - secure_configuration
  - hardening
  - endpoint_security
  - network_security
  weight: 1.4
  source_locator: Appendix III, Preventive Controls 1.5 Secure System Configuration
