- control_id: CBN-DMBPSB-5.0-METRICS
  reference: 5.0(i)-(iv)
  title: Cybersecurity metrics and management reporting
  requirement_summary: Define cybersecurity performance/risk metrics aligned with
    strategic objectives, review the metrics at least annually, use them to identify
    control deficiencies and provide the required quarterly Board programme reports.
  evidence_examples:
  - KPI/KRI/KGI catalogue
  - annual metrics review
  - cyber dashboard
  - quarterly board report
  - remediation metrics
  capability_tags:
