  reference: 3.5 / Appendix III 4
  title: Recovery and restoration after cyber incidents
  requirement_summary: Maintain tested recovery processes for systems and assets affected
    by cyber incidents, define criteria for moving from response to recovery after
    threats have been addressed, periodically test backup restoration, and improve
    recovery strategies using lessons learned.
  evidence_examples:
  - cyber recovery plan
  - backup restoration test
  - recovery checklist
  - post-incident review
  - lessons-learned tracker
  capability_tags:
