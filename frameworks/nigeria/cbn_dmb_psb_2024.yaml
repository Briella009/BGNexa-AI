- control_id: CBN-DMBPSB-APP3-3
  reference: Appendix III 3
  title: Incident response planning, exercises and forensics
  requirement_summary: Maintain incident-response plans and playbooks for on-premises
    and cloud incidents, regularly exercise them using appropriate drills/tabletops
    or red-versus-blue tests, involve Senior Management, maintain a trained incident-response
    team, preserve forensic chain of custody, define stakeholder communications and
    maintain rapid-access external response support where needed.
  evidence_examples:
  - incident response plan
  - incident playbooks
  - tabletop report
  - red-blue exercise report
  - IR team training
  - chain-of-custody form
  - retainer
  capability_tags:
  - incident_response
  - exercises
  - forensics
  - crisis_management
  weight: 1.7
  source_locator: Appendix III, Respond and Remediate
