- control_id: CBN-DMBPSB-APP3-2.1
  reference: Appendix III 2.1
  title: SOC, logging and continuous security monitoring
  requirement_summary: Operate continuous 24x7 security monitoring, supported by an
    in-house or outsourced SOC with skilled personnel, adequate processes and suitable
    tooling such as SIEM; define log retention, enable logging across on-premises
    and third-party/cloud systems, investigate suspicious activity and maintain automated
    detection and alerting capabilities.
  evidence_examples:
  - SOC charter
  - 24x7 roster
  - SIEM architecture
  - log retention standard
  - detection use cases
  - alert records
  - SOC board report
  capability_tags:
