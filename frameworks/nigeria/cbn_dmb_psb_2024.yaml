  reference: Appendix III 1.9
  title: Vulnerability remediation and patch management
  requirement_summary: Define remediation responsibilities and timelines by vulnerability
    category, test and scan patches before deployment, apply security updates promptly
    after testing, verify successful remediation, and periodically audit patch/remediation
    processes with management reporting.
  evidence_examples:
  - patch management policy
  - vulnerability SLA
  - patch test records
  - deployment evidence
