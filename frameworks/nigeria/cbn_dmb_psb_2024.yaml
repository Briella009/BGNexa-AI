- control_id: CBN-DMBPSB-5.0-V
  reference: 5.0(v)
  title: CBN cyber-incident notification within 24 hours of detection
  requirement_summary: Maintain a process to report reportable cyber incidents to
    the Director of Banking Supervision not later than 24 hours after detection, using
    the prescribed reporting format and providing additional information where required.
  evidence_examples:
  - regulatory incident procedure
  - CBN reporting template
  - incident log
  - notification timestamp
  - submission acknowledgement
  capability_tags:
  - incident_response
  - regulatory_reporting
  weight: 1.8
  source_locator: Section 5.0(v) and Appendix VII
