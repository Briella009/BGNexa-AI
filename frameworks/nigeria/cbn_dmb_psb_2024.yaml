- control_id: CBN-DMBPSB-1.1.1
  reference: 1.1.1
  title: Cybersecurity strategy, framework and policy lifecycle
  requirement_summary: Maintain a Board-directed cybersecurity strategy and framework
    aligned with business objectives and legal, contractual, statutory and regulatory
    obligations; clearly assign cybersecurity roles and responsibilities and review
    the cybersecurity policy at least annually or when material cyber-risk exposure
    changes.
  evidence_examples:
  - cybersecurity strategy
  - cybersecurity framework
  - cybersecurity policy
  - annual policy review record
  - roles and responsibilities matrix
  capability_tags:
  - governance
  - strategy
  - policy_management
  - regulatory_compliance
  weight: 1.3
  source_locator: Section 1.1.1
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 8
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-1.2
  reference: '1.2'
  title: Senior Management cybersecurity responsibilities
  requirement_summary: Ensure Senior Management implements Board-approved cybersecurity
    policies and programmes, supports the approved CISO role, reports cybersecurity
    status to the Board at least quarterly, enables regular Information Security training,
    and integrates cyber-risk management into enterprise risk management and risk-appetite
    processes.
  evidence_examples:
  - management cybersecurity charter
  - CISO approval records
  - quarterly board report
  - security training records
  - ERM cyber-risk mapping
  capability_tags:
  - governance
  - senior_management
  - reporting
  - training
  - enterprise_risk
  weight: 1.3
  source_locator: Section 1.2
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 9
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-1.3-1.4
  reference: 1.3-1.4
  title: CISO authority, independence and competence
  requirement_summary: Maintain a CISO responsible for day-to-day cybersecurity and
    implementation of the Board-approved programme, with appropriate authority, independence,
    reporting line, qualifications and experience; avoid reporting arrangements that
    create conflicts with IT operations or the Chief Risk Officer and retain required
    CBN approval evidence.
  evidence_examples:
  - CISO appointment letter
  - CBN approval
  - organisation chart
  - role description
  - qualification records
  - independence statement
  capability_tags:
  - governance
  - ciso
  - independence
  - competence
  weight: 1.5
  source_locator: Sections 1.3 and 1.4
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 9
  - 10
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-1.6
  reference: 1.6 / 1.6.1-1.6.3
  title: Independent risk, audit and compliance challenge
  requirement_summary: Review cybersecurity governance processes and controls at least
    annually and maintain independent risk, audit and compliance challenge. Cyber-risk
    evaluation should use appropriate methods, audit scope and independence should
    be defined, and compliance should periodically review adherence to CBN directives
    and applicable regulation.
  evidence_examples:
  - annual governance review
  - cyber risk report
  - audit plan
  - independent audit report
  - compliance review
  - qualifications of reviewers
  capability_tags:
  - governance
  - risk_assessment
  - internal_audit
  - compliance
  weight: 1.4
  source_locator: Section 1.6 and subsections 1.6.1-1.6.3
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 12
  - 13
  verification_note: Cross-checked against the user-supplied CBN May 2024 PDF on 2026-08-19.
- control_id: CBN-DMBPSB-2.1.4
  reference: 2.1.4
  title: Cyber-risk treatment and acceptance governance
  requirement_summary: Select cyber-risk treatment options according to asset criticality
    and assessment outcomes, govern residual-risk acceptance using Board-approved
    criteria, and document detailed risk assessment when transferring risk through
    outsourcing or cyber-risk insurance.
  evidence_examples:
  - risk treatment plan
  - residual risk register
  - board-approved risk acceptance criteria
  - outsourcing risk assessment
  - cyber insurance assessment
  capability_tags:
  - risk_treatment
  - risk_acceptance
  - governance
  - third_party_risk
  weight: 1.3
