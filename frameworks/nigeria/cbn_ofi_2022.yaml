framework_id: cbn-ofi-2022
name: CBN Risk-Based Cybersecurity Framework - OFIs
jurisdiction: Nigeria
version: '2022'
authority: Central Bank of Nigeria
source:
  authority: Central Bank of Nigeria
  title: Risk-Based Cybersecurity Framework and Guidelines for Other Financial Institutions
    (OFIs)
  version: June 2022
  source_url: https://www.cbn.gov.ng/Out/2022/OFISD/Letter%20to%20all%20OFIs%20Issuance%20of%20Risk-Based%20Cybersecurity%20Framework%20and%20Guidelines%20for%20Other%20Financial%20Institutions.pdf
  last_verified: '2026-08-19'
  source_type: direct_authority_pdf_verified_user_supplied_scan
  notes: Effective date stated in the issuing letter is 1 January 2023. The user-supplied
    authority PDF is image-only and was verified by full render review on 2026-08-19.
    The source PDF is marked Classified as Confidential and is not redistributed.
scope_note: Selected high-value controls from the CBN OFI 2022 framework, directly
  verified against the user-supplied 43-page scanned authority document. This control
  pack is traceable but does not claim to reproduce every requirement in the source.
copyright_mode: public_regulatory_guidance_paraphrase
controls:
- control_id: CBN-OFI-2.4.14
  reference: 2.4.14
  title: Cybersecurity as a standing Board agenda item
  requirement_summary: Cybersecurity should be a standing agenda item at Board meetings.
  evidence_examples:
  - board minutes
  - board agenda
  - cybersecurity board report
  capability_tags:
  - governance
  - board_oversight
  weight: 1.0
  source_locator: 2.4.14
  verification_status: direct_authority_pdf_verified
