- control_id: CBN-OFI-APP3-1
  reference: Appendix III - 1
  title: Access control baseline
  requirement_summary: Establish an access control policy and supporting mechanisms
    for identity, credential, authorisation, least-privilege and physical-access management
    across information assets.
  evidence_examples:
  - access control policy
  - access control matrix
  - identity lifecycle procedure
  - access review records
  capability_tags:
  - access_control
  - identity_management
  weight: 1.4
  source_locator: Appendix III, section 1 - Access Control
  source_pdf_pages:
  - 25
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-2
  reference: Appendix III - 2
  title: Secure configuration management
  requirement_summary: Maintain secure baseline configurations and controls to detect,
    log and respond to unauthorised configuration changes.
  evidence_examples:
  - secure configuration standard
  - hardening baseline
  - configuration monitoring
  - change records
  capability_tags:
  - secure_configuration
  - change_management
  weight: 1.3
  source_locator: Appendix III, section 2 - Secure System Configuration Management
  source_pdf_pages:
  - 25
  - 26
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-3
  reference: Appendix III - 3
  title: Cybersecurity awareness training
  requirement_summary: Maintain cybersecurity awareness content and ensure Board members
    and employees participate at least annually, with appropriate awareness for vendors
    and customers.
  evidence_examples:
  - security awareness programme
  - training attendance
  - board training records
  - vendor awareness records
  capability_tags:
  - security_awareness
  - training
  - governance
  weight: 1.2
  source_locator: Appendix III, section 3 - Cybersecurity Awareness Training
  source_pdf_pages:
  - 26
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-4
  reference: Appendix III - 4
  title: Data security and loss prevention
  requirement_summary: Protect sensitive and confidential information through classification,
    monitoring, data-loss controls, secure disposal and equivalent controls at relevant
    vendor-managed facilities.
  evidence_examples:
  - data classification policy
  - DLP configuration
  - secure disposal procedure
  - vendor security assessment
  capability_tags:
  - data_security
  - data_classification
  - third_party_risk
  weight: 1.5
  source_locator: Appendix III, section 4 - Data Security
  source_pdf_pages:
  - 27
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-5
  reference: Appendix III - 5
  title: Secure system life cycle management
  requirement_summary: Establish lifecycle policies for systems and applications and
    integrate cybersecurity controls into acquisition, development, maintenance, update
    and disposal activities.
  evidence_examples:
  - SDLC policy
  - secure development standard
  - security requirements
  - decommissioning procedure
  capability_tags:
  - secure_development
  - system_lifecycle
  - data_security
  weight: 1.4
  source_locator: Appendix III, section 5 - System Life Cycle Management
  source_pdf_pages:
  - 27
  - 28
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-6A
  reference: Appendix III - 6(a)
  title: Vulnerability management
  requirement_summary: Maintain a Board-approved vulnerability management strategy,
    identify and document vulnerabilities, and conduct vulnerability assessments at
    least quarterly and after significant infrastructure changes or newly disclosed
    vulnerabilities.
  evidence_examples:
  - vulnerability management policy
  - quarterly vulnerability scan
  - vulnerability register
  - remediation records
  capability_tags:
  - vulnerability_management
  - risk_assessment
  - patch_management
  weight: 1.6
  source_locator: Appendix III, section 6(a) - Vulnerability Management / Information
    Assets
  source_pdf_pages:
  - 28
  - 29
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-6B
  reference: Appendix III - 6(b)
  title: Privileged account risk controls
  requirement_summary: Identify privileged employees and service accounts and apply
    segregation of duties, least privilege, appropriate account management and restrictions
    on shared privileged credentials.
  evidence_examples:
  - privileged account inventory
  - PAM policy
  - access review
  - segregation of duties matrix
  capability_tags:
  - privileged_access
  - access_control
  - identity_management
  weight: 1.5
  source_locator: Appendix III, section 6(b) - System Administrators and Privileged
    Accounts
  source_pdf_pages:
  - 29
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-6C
  reference: Appendix III - 6(c)
  title: Vendor privileged-access controls
  requirement_summary: Restrict vendor access to information assets, require management
    approval where access is needed, monitor vendor activity and avoid unattended
    or unfettered vendor access.
  evidence_examples:
  - vendor access procedure
  - vendor access approvals
  - session logs
  - third-party access review
  capability_tags:
  - third_party_risk
  - access_control
  - monitoring
  weight: 1.5
  source_locator: Appendix III, section 6(c) - Vendors
  source_pdf_pages:
  - 30
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-7
  reference: Appendix III - 7
  title: Continuous security monitoring
  requirement_summary: Define and operate continuous security monitoring covering
    relevant systems, databases, networks, log security, monitoring baselines, alerting,
    anomaly detection and response-related information.
  evidence_examples:
  - continuous monitoring strategy
  - SIEM configuration
  - log retention policy
  - SOC monitoring records
  capability_tags:
  - monitoring
  - detection
  - logging
  weight: 1.6
  source_locator: Appendix III, section 7 - Continuous Security Monitoring
  source_pdf_pages:
  - 30
  - 31
  - 32
  verification_status: direct_authority_pdf_verified
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
  applicability: {}
  notes: null
- control_id: CBN-OFI-APP3-8
  reference: Appendix III - 8
  title: Incident response and disaster recovery
  requirement_summary: Maintain and test incident response, disaster recovery and
    business continuity arrangements, including Board-approved incident response planning,
    defined response roles, exercises and continuous improvement from lessons learned.
  evidence_examples:
  - incident response plan
  - DR/BCP plan
  - exercise schedule
  - tabletop report
  - lessons learned
  capability_tags:
  - incident_response
  - business_continuity
  - recovery
  weight: 1.7
