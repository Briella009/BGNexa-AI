- control_id: CBN-OFI-2.10.4
  reference: 2.10.4
  title: Cybersecurity policy review
  requirement_summary: Board-approved cybersecurity policy documents should be reviewed
    and updated at least annually or when significant cyber-risk changes occur.
  evidence_examples:
  - cybersecurity policy
  - policy review log
  - board approval
  - change history
  capability_tags:
  - policy_management
  - governance
  weight: 1.0
  source_locator: 2.10.4
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 14
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-3.7
  reference: '3.7'
  title: Cyber risk, vulnerability and threat assessment
  requirement_summary: Regularly conduct risk assessments, vulnerability assessments
    and threat analysis to evaluate risks to information assets and control adequacy.
  evidence_examples:
  - cyber risk assessment
  - vulnerability assessment
  - penetration test
  - threat analysis
  capability_tags:
  - risk_assessment
  - vulnerability_management
  - threat_intelligence
  weight: 1.5
  source_locator: '3.7'
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 15
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-4.3
  reference: '4.3'
  title: Annual cybersecurity self-assessment reporting
  requirement_summary: Conduct the prescribed annual cybersecurity self-assessment
    and submit the signed report to the relevant CBN supervision function on or before
    31 March, including gaps, threats, risks, impacts, action plans, timelines and
    remediation status.
  evidence_examples:
  - cybersecurity self-assessment
  - submission acknowledgement
  - remediation roadmap
  - CISO sign-off
  capability_tags:
  - regulatory_reporting
  - self_assessment
  - remediation
  weight: 1.5
  source_locator: '4.3'
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 16
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-5.1
  reference: '5.1'
  title: Asset and environment inventory
  requirement_summary: Maintain an up-to-date inventory of authorised software, hardware,
    network devices and connections, and identify, remove and report unauthorised
    assets.
  evidence_examples:
  - asset inventory
  - software inventory
  - network diagram
  - unauthorised asset process
  capability_tags:
  - asset_management
  - network_security
  weight: 1.3
  source_locator: '5.1'
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 16
  - 21
  - 22
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-6.1
  reference: '6.1'
  title: Cyber-threat intelligence programme
  requirement_summary: Establish a cyber-threat intelligence programme to proactively
    identify, detect and mitigate potential cyber threats and risks.
  evidence_examples:
  - CTI policy
  - threat feeds
  - intelligence reports
  - threat briefings
  - IOC process
  capability_tags:
  - threat_intelligence
  - detection
  weight: 1.2
  source_locator: 6.1-6.5
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 17
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-7.5
  reference: '7.5'
  title: Quarterly cybersecurity status reporting
  requirement_summary: Provide the Board and Senior Management with quarterly reports
    on the state of the cyber/information security programme and governance issues.
  evidence_examples:
  - quarterly cyber report
  - management dashboard
  - board report
  capability_tags:
  - metrics
  - reporting
  - governance
  weight: 1.0
  source_locator: '7.5'
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 18
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-7.6
  reference: '7.6'
  title: CBN cyber-incident reporting
  requirement_summary: Maintain a process to report all cyber incidents, whether successful
    or unsuccessful, to the Director, Other Financial Institutions Supervision Department
    not later than 24 hours after detection using the prescribed reporting format.
  evidence_examples:
  - incident reporting procedure
  - CBN notification template
  - incident log
  - notification evidence
  capability_tags:
  - incident_response
  - regulatory_reporting
  weight: 1.7
  source_locator: '7.6'
  verification_status: direct_authority_pdf_verified
  source_pdf_pages:
  - 18
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-8.1
  reference: '8.1'
  title: Statutory and regulatory cybersecurity compliance
  requirement_summary: Board and Senior Management should ensure compliance with relevant
    cybersecurity statutes, regulations and CBN directives.
  evidence_examples:
  - legal register
  - compliance register
  - regulatory mapping
  - compliance report
  capability_tags:
  - regulatory_compliance
  - governance
  weight: 1.0
  source_locator: '8.1'
