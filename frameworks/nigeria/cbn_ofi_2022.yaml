  - 8
  verification_note: Verified by visual review of the user-supplied scanned CBN OFI
    authority PDF on 2026-08-19.
- control_id: CBN-OFI-2.4.18
  reference: 2.4.18
  title: CISO appointment or designation
  requirement_summary: Appoint or designate a qualified CISO responsible for oversight
    and implementation of the cybersecurity programme.
  evidence_examples:
  - CISO appointment letter
  - job description
  - organisation chart
  capability_tags:
  - governance
  - ciso
  weight: 1.2
  source_locator: 2.4.18 and 2.6
  verification_status: direct_authority_pdf_verified
