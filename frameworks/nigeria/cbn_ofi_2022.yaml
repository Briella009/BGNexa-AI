    authority PDF on 2026-08-19.
- control_id: CBN-OFI-2.4.17
  reference: 2.4.17
  title: Quarterly Board cybersecurity reporting
  requirement_summary: The Board should receive and review quarterly reporting on
    the overall cybersecurity programme and adherence to approved cyber-risk thresholds.
  evidence_examples:
  - quarterly cyber report
  - board pack
  - risk dashboard
  - board minutes
  capability_tags:
  - governance
  - metrics
  - reporting
  weight: 1.2
  source_locator: 2.4.17
  verification_status: direct_authority_pdf_verified
