name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt pytest
      - name: Compile core
        run: python -m py_compile src/*.py scripts/*.py tests/*.py
      - name: Run tests
        run: pytest -q
      - name: Audit framework provenance
        run: python scripts/audit_framework_sources.py --strict
      - name: Run Stage 4 deterministic evaluations
        run: python scripts/run_evals.py --strict
      - name: Run Stage 2 offline product smoke test
        run: python scripts/smoke_stage2.py
      - name: Run Stage 4 quality smoke test
        run: python scripts/smoke_stage4.py
