name: tests

on:
  push:
    branches:
      - main
      - "v0.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bgnexa-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements.txt
      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt pytest
      - name: Compile Python entrypoints and core
        run: python -m py_compile app.py pages/*.py src/*.py scripts/*.py tests/*.py
      - name: Run tests
        run: pytest -q
      - name: Audit framework provenance
        run: python scripts/audit_framework_sources.py --strict
      - name: Run Stage 4 deterministic evaluations
        run: python scripts/run_evals.py --strict
      - name: Run Stage 2 offline product smoke test
        run: python scripts/smoke_stage2.py
      - name: Run Stage 4 quality smoke test
        run: python scripts/smoke_stage4.py
