name: Capture README demo

on:
  push:
    branches: [readme-visual-demo]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: readme-visual-demo
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install app and capture dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start BGNexa
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/bgnexa.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bgnexa.log
          exit 1
      - name: Capture real UI frames and animated GIF
        run: |
          mkdir -p assets/screenshots
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright

          out = Path("assets/screenshots")
          frames = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 900}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8501", wait_until="networkidle")
              page.get_by_text("Evidence intelligence for real assurance work", exact=True).wait_for(timeout=30000)
              page.screenshot(path=out / "bgnexa-01-home.png", full_page=False)
              frames.append(out / "bgnexa-01-home.png")

              page.get_by_role("button", name="Run readiness assessment").click()
              dashboard = page.get_by_text("Readiness dashboard", exact=True)
              dashboard.wait_for(timeout=60000)
              dashboard.scroll_into_view_if_needed()
              page.wait_for_timeout(1200)
              page.screenshot(path=out / "bgnexa-02-readiness.png", full_page=False)
              frames.append(out / "bgnexa-02-readiness.png")

              queue = page.get_by_text("Priority remediation queue", exact=True)
              queue.scroll_into_view_if_needed()
              page.wait_for_timeout(800)
              page.screenshot(path=out / "bgnexa-03-remediation.png", full_page=False)
              frames.append(out / "bgnexa-03-remediation.png")
              browser.close()

          images = [Image.open(p).convert("P", palette=Image.Palette.ADAPTIVE) for p in frames]
          images[0].save(
              out / "bgnexa-demo.gif",
              save_all=True,
              append_images=images[1:],
              duration=[1800, 2400, 2400],
              loop=0,
              optimize=True,
          )
          PY
      - name: Commit demo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/bgnexa-01-home.png                   assets/screenshots/bgnexa-02-readiness.png                   assets/screenshots/bgnexa-03-remediation.png                   assets/screenshots/bgnexa-demo.gif
          git commit -m "docs: add real BGNexa demo media [skip ci]"
          git push origin HEAD:readme-visual-demo
